function validateStep1() {

    const aadhaar = document.getElementById("aadhaarNumber").value.trim();
    const address = document.getElementById("address").value.trim();

    const state = document.getElementById("state").value.trim();
    const pincode = document.getElementById("pincode").value.trim();

    if (!relationship) {
        alert("Please select your relationship to the child.");
        return;
    }

    if (!/^[0-9]{10}$/.test(mobile)) {
        alert("Please enter a valid 10-digit mobile number.");
        return;
    }

    if (!/^[0-9]{12}$/.test(aadhaar)) {
        alert("Please enter a valid 12-digit Aadhaar number.");

    }

    if (!/^[0-9]{6}$/.test(pincode)) {
        alert("Please enter a valid 6-digit pincode.");
        return;
    }

    // Everything is valid
    // alert("Validation successful!");
    saveStep1();

    // Next step
    // saveStep1();

async function saveStep1() {

    const { data } = await supabaseClient.auth.getSession();

    if (!data.session) {
    alert("Session expired. Please login again.");
    return;
}

const user = data.session.user;

    const relationship = document.getElementById("relationship").value;
    const applicantName = document.getElementById("applicantName").value;
    const mobile = document.getElementById("mobileNumber").value;
    const email = document.getElementById("applicantEmail").value;
    const aadhaar = document.getElementById("aadhaarNumber").value;
    const address = document.getElementById("address").value;
    const city = document.getElementById("city").value;
    const state = document.getElementById("state").value;
    const pincode = document.getElementById("pincode").value;

    // -----------------------------------
    // Check if draft already exists
    // -----------------------------------

    const { data: existingApplication } = await supabaseClient
        .from("applications")
        .select("*")
        .eq("created_by", user.id)
        .eq("status", "draft")
        .maybeSingle();

    let application;
    let error;

    // -----------------------------------
    // UPDATE existing draft
    // -----------------------------------

    if (existingApplication) {

        const result = await supabaseClient
            .from("applications")
            .update({

                relationship: relationship,
                applicant_name: applicantName,
                applicant_mobile: mobile,
                applicant_email: email,
                applicant_aadhaar: aadhaar,
                applicant_address: address,
                applicant_city: city,
                applicant_state: state,
                applicant_pincode: pincode,

                current_step: 2

            })
            .eq("id", existingApplication.id)
            .select()
            .single();

        application = result.data;
        error = result.error;

    }

    // -----------------------------------
    // CREATE new draft
    // -----------------------------------

    else {

        const result = await supabaseClient
            .from("applications")
            .insert({

                created_by: user.id,

                relationship: relationship,
                applicant_name: applicantName,
                applicant_mobile: mobile,
                applicant_email: email,
                applicant_aadhaar: aadhaar,
                applicant_address: address,
                applicant_city: city,
                applicant_state: state,
                applicant_pincode: pincode,

                status: "draft",
                current_step: 2

            })
            .select()
            .single();

        application = result.data;
        error = result.error;

    }

    if (error) {
        console.error(error);
        alert(error.message);
        return;
    }

    console.log(application);

    renderStep2(application.id);

}

function selectPatientType(type){

    selectedPatientType = type;

    document.getElementById("humanCard").classList.remove("active");
    document.getElementById("petCard").classList.remove("active");

    if(type === "Human"){
        document.getElementById("humanCard").classList.add("active");
    }else{
        document.getElementById("petCard").classList.add("active");
    }

    document.getElementById("patientTypeContinue").disabled = false;
}

    }

async function saveStep2(applicationId, patientType){

    let patientData = {

        application_id: applicationId,

        patient_type: patientType

    };

    if(patientType === "Human"){

        patientData.patient_name =
            document.getElementById("patientName").value.trim();

        patientData.gender =
            document.getElementById("patientGender").value;

        patientData.age =
            parseInt(document.getElementById("patientAge").value);

        patientData.date_of_birth =
            document.getElementById("patientDob").value || null;

        patientData.aadhaar_number =
            document.getElementById("patientAadhaar").value.trim() || null;

        patientData.blood_group =
            document.getElementById("bloodGroup").value || null;

        patientData.height_cm =
            document.getElementById("heightCm").value || null;

        patientData.weight_kg =
            document.getElementById("weightKg").value || null;

    }else{

        patientData.patient_name =
            document.getElementById("petName").value.trim();

        patientData.animal_type =
            document.getElementById("animalType").value;

        patientData.breed =
            document.getElementById("breed").value.trim() || null;

        patientData.gender =
            document.getElementById("petGender").value;

        patientData.age =
            parseInt(document.getElementById("petAge").value);

        patientData.weight_kg =
            document.getElementById("petWeight").value || null;

        patientData.identification_marks =
            document.getElementById("identificationMarks").value.trim() || null;

    }

    // ----------------------------------
    // Check if patient already exists
    // ----------------------------------

    const { data: existingPatient } = await supabaseClient
        .from("application_patients")
        .select("*")
        .eq("application_id", applicationId)
        .maybeSingle();

    let error;

    // ----------------------------------
    // UPDATE
    // ----------------------------------

    if(existingPatient){

        const result = await supabaseClient
            .from("application_patients")
            .update({

                patient_type: patientData.patient_type,

                patient_name: patientData.patient_name,

                gender: patientData.gender,

                age: patientData.age,

                date_of_birth: patientData.date_of_birth,

                aadhaar_number: patientData.aadhaar_number,

                blood_group: patientData.blood_group,

                height_cm: patientData.height_cm,

                weight_kg: patientData.weight_kg,

                animal_type: patientData.animal_type,

                breed: patientData.breed,

                identification_marks: patientData.identification_marks

            })
            .eq("id", existingPatient.id);

        error = result.error;

    }

    // ----------------------------------
    // INSERT
    // ----------------------------------

    else{

        const result = await supabaseClient
            .from("application_patients")
            .insert(patientData);

        error = result.error;

    }

    if(error){

        console.error(error);

        alert(error.message);

        return;

    }

    // ----------------------------------
    // Move to Step 3
    // ----------------------------------

    const { error: updateError } = await supabaseClient
        .from("applications")
        .update({
            current_step: 3
        })
        .eq("id", applicationId);

    if(updateError){

        console.error(updateError);

        alert(updateError.message);

        return;

    }

    alert("Patient details saved successfully!");

    renderStep3(applicationId);

}

async function saveStep4(applicationId){

        document.getElementById("diseaseDocument").files[0];

    const doctorPrescription =
        document.getElementById("doctorPrescription").files[0];

        document.getElementById("identityDocument").files[0];

    const medicalReports =
        document.getElementById("medicalReports").files;

    const folder = applicationId;

    // ---------- Upload Helper ----------

    async function upload(file, path){

    console.log("Uploading:", path);

    const { data, error } = await supabaseClient.storage
        .from("medical-documents")
        .upload(path, file, {
            upsert: true
        });

    console.log("Upload Data:", data);
    console.log("Upload Error:", error);

    if(error){
        throw error;
    }

    return path;

}

    try{

        const patientPhotoPath =
            await upload(
                patientPhoto,
                `${folder}/patient-photo.${patientPhoto.name.split(".").pop()}`
            );

        const diseaseDocumentPath =
            await upload(
                diseaseDocument,
                `${folder}/disease-document.${diseaseDocument.name.split(".").pop()}`
            );

        const doctorPrescriptionPath =
            await upload(
                doctorPrescription,
                `${folder}/doctor-prescription.${doctorPrescription.name.split(".").pop()}`
            );

        const identityDocumentPath =
            await upload(
                identityDocument,
                `${folder}/identity-document.${identityDocument.name.split(".").pop()}`
            );

        // ---------- Multiple Reports ----------

        const reportPaths = [];

        for(const report of medicalReports){

            const reportPath =
                `${folder}/reports/${Date.now()}-${report.name}`;

            await upload(report, reportPath);

            reportPaths.push(reportPath);

        // ---------- Existing Row ----------

                    updated_at: new Date().toISOString()

                .eq("id", existing.id);

                    identity_document: identityDocumentPath,

            .from("applications")
            .update({

                current_step: 5

            .eq("id", applicationId);

        if(updateError){

            alert(updateError.message);

        }

        alert("Documents uploaded successfully!");

        document.getElementById("ifscCode").value.trim().toUpperCase();

    const declaration =
        document.getElementById("declaration").checked;
    if(!requiredAmount || requiredAmount <= 0){

    alert("Please enter the required amount.");

    return;

}
    if(!accountHolderName){

        alert("Please enter the account holder name.");
        return;

    }

    if(!bankName){

        alert("Please enter the bank name.");
        return;

    }

    if(!accountNumber){

        alert("Please enter the account number.");
        return;

    }

    if(!confirmAccountNumber){

        alert("Please confirm the account number.");
        return;

    }

    if(accountNumber !== confirmAccountNumber){

        alert("Account numbers do not match.");
        return;

    }

    if(!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(ifscCode)){

        alert("Please enter a valid IFSC code.");

        return;

    }

    if(!declaration){

        alert("Please accept the declaration before submitting.");

        return;

    }

    saveStep5(applicationId);

}
async function saveStep5(applicationId){
    const requiredAmount =
    Number(document.getElementById("requiredAmount").value);
    const accountHolderName =
        document.getElementById("accountHolderName").value.trim();

    const bankName =
        document.getElementById("bankName").value.trim();

    const accountNumber =
        document.getElementById("accountNumber").value.trim();

    const ifscCode =
        document.getElementById("ifscCode").value.trim().toUpperCase();

    const upiId =
        document.getElementById("upiId").value.trim();

const { error } = await supabaseClient
.from("applications")
.update({

    required_amount: requiredAmount,

    account_holder_name: accountHolderName,

    bank_name: bankName,

    account_number: accountNumber,

    ifsc_code: ifscCode,

    upi_id: upiId || null,

    status:"submitted",

    current_step:6,

    submitted_at:new Date().toISOString()

})
.eq("id",applicationId);

    if(error){

        console.error(error);

        alert(error.message);

        return;

    }

    alert("Application submitted successfully!");

    renderApplicationSuccess(applicationId);

}

async function checkSession() {

    const { data } = await supabaseClient.auth.getSession();

    if (!data.session) {

        document.getElementById("authCard").style.display = "block";

        document.getElementById("applicationForm").style.display = "none";
        document.getElementById("applicationForm").innerHTML = "";

        showSignIn();

        return;

    }

    const user = data.session.user;

    const { data: profile } = await supabaseClient
        .from("profiles")
        .select("full_name")
        .eq("id", user.id)
        .single();

    const fullName = profile?.full_name || user.email;

    document.getElementById("authCard").style.display = "none";
    document.getElementById("applicationForm").style.display = "block";

    // -------------------------------------
    // Load all applications
    // -------------------------------------

    const { data: applications, error } = await supabaseClient
        .from("applications")
        .select("*")
        .eq("created_by", user.id)
        .order("created_at", { ascending: false });

    if (error) {

        alert(error.message);

        return;

    }

    // -------------------------------------
    // No applications
    // -------------------------------------

    if (!applications || applications.length === 0) {

        renderStep1(fullName, user.email);

        return;

    }

    // -------------------------------------
    // Resume latest draft if available
    // -------------------------------------

    const draftApplication =
        applications.find(app => app.status === "draft");

    if (draftApplication) {

        loadApplication(
            draftApplication,
            fullName,
            user.email
        );

        return;

    }

    // -------------------------------------
    // Otherwise show dashboard
    // -------------------------------------

    renderMyApplications(
        applications,
        fullName
    );

}
function loadApplication(application, fullName, email){

    switch(application.current_step){

        case 1:
            renderStep1(
                fullName,
                email,
                application
            );
            break;

        case 2:
            renderStep2(application.id);
            break;

        case 3:
            renderStep3(application.id);
            break;

        // case 4:
        //     renderStep4(application.id);
        //     break;

        default:
            renderStep1(fullName,email);

    }

}

        user.email,

    );

}

async function signUp() {

    const fullName = document.getElementById("fullName").value.trim();
    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("signupEmail").value.trim().toLowerCase();
    const password = document.getElementById("signupPassword").value;

    // Validation
    if (!fullName || !username || !email || !password) {
        alert("Please fill all fields.");
        return;
    }

    // Check if username already exists
    const { data: existingUser, error: usernameError } = await supabaseClient
        .from("profiles")
        .select("username")
        .eq("username", username)
        .maybeSingle();

    if (usernameError) {
        alert(usernameError.message);
        return;
    }

    if (existingUser) {
        alert("Username already exists. Please choose another.");
        return;
    }

    // Create Auth User
    const { data, error } = await supabaseClient.auth.signUp({
        email,
        password
    });

    if (error) {
        alert(error.message);
        return;
    }

    // Save profile
    const { error: profileError } = await supabaseClient
        .from("profiles")
        .insert({
            id: data.user.id,
            full_name: fullName,
            username: username,
            email: email
        });

    if (profileError) {
        alert(profileError.message);
        return;
    }

    alert("Account created successfully!");

    // Refresh session/UI
    checkSession();
}

async function signIn() {

    const email =
        document.getElementById("loginIdentifier").value.trim().toLowerCase();

    const password =
        document.getElementById("loginPassword").value;

    const { error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
    });

    if (error) {
        alert(error.message);
        return;
    }

    checkSession();

}

async function logout() {

    const { error } = await supabaseClient.auth.signOut();

    if (error) {
        alert(error.message);
        return;
    }

    // Reset forms
    document.getElementById("signinForm").reset();
    document.getElementById("signupForm").reset();

    // Hide application
    document.getElementById("applicationForm").style.display = "none";
    document.getElementById("applicationForm").innerHTML = "";

    // Show authentication card
    document.getElementById("authCard").style.display = "block";

    // Default to Sign In tab
    showSignIn();

    // Clear temporary variables
    selectedPatientType = null;

}
